name: Release gate (tags v*)

on:
  push:
    tags: ['v*']

jobs:
  changelog-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "CHANGELOG entry required for this tag (ADR-0020 D2 / Painel R-4; literal match — review EX-3)"
        run: |
          set -euo pipefail
          chmod +x scripts/check-changelog.sh
          scripts/check-changelog.sh "${GITHUB_REF_NAME}"

      - name: "Tag content must be a reproducible build"
        run: |
          set -euo pipefail
          node scripts/build.js
          # Covers modifications, deletions and untracked extras (review EX-2).
          STATUS="$(git status --porcelain -- build/)"
          if [ -n "$STATUS" ]; then
            echo "$STATUS"
            echo "::error::tagged build/ is not exactly the generated output."
            exit 1
          fi
