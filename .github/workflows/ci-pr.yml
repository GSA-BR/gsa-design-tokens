name: Design Tokens CI (PR)

on:
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate tokens
        run: node scripts/build.js --validate

      - name: Build all outputs
        run: node scripts/build.js
