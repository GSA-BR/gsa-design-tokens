name: Design Tokens CI (PR)

on:
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical source
        run: node scripts/build.js --validate

      - name: Build canonical outputs
        run: node scripts/build.js

      - name: "Reproducible build: build/ must match the generated output (issue #7)"
        run: |
          set -euo pipefail
          git diff --exit-code -- build/ || {
            echo "::error::build/ diverges from the generated output — run 'npm run build' and commit; never edit build/ by hand."
            exit 1
          }
